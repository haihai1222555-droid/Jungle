version: '3.8'

services:
  jungle-laundry:
    build: .
    container_name: jungle-laundry-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SUBS_FILE=/app/data/push_subscriptions.json
    volumes:
      # 단일 파일을 bind 하면 파일이 없을 때 도커가 디렉터리를 생성해 저장이 깨진다.
      # 디렉터리를 마운트하고 파일 경로는 SUBS_FILE 로 지정한다.
      - ./data:/app/data
