# /etc/systemd/system/caddy.service.d/restart.conf
#
# Caddy 가 오류로 죽으면 5초 뒤 다시 띄운다.
# 기본 서비스 파일은 Restart=no 라서, 한 번 죽으면 사람이 켤 때까지 사이트가 닫혀 있다.
# (2026-11-09 에 Caddy 가 한 번 죽어 사이트가 약 13분 닫혔다.)
#
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo cp deploy/caddy-restart.conf /etc/systemd/system/caddy.service.d/restart.conf
#   sudo systemctl daemon-reload
#
# 5분 안에 10번 넘게 죽으면 systemd 가 포기한다. 그때는 로그를 봐야 한다.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=5
